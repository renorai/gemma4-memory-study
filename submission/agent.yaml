# Renor transferable-memory coder: Kaggle Gemma 4 Developer Agent submission (template).
# Declarative only (HARNESS_README.md): compiled by the harness's sandboxed YAML compiler.
# runner/build_submission.py writes the real directory per arm; runner/validate.py checks it.
# Lines marked VERIFY follow ADK Agent Config field names but were not in the guide excerpt we
# had; the first 2-task smoke in kernels/throughput.py checks that they compile.
# Memory arms get a `skills:` list appended by the builder; the no-memory arm has none.
agent_class: LlmAgent
name: coder
model: gemma-4-31b-it-qat-w4a16-ct
description: Fixes one issue in a Python repository and submits the patch.
instruction: !include prompts/coder.md
generate_content_config:            # VERIFY: field names
  max_output_tokens: 16384          # harness default
  thinking_config:
    include_thoughts: true          # vLLM: include_thoughts + thinking_budget, not thinking_level
    thinking_budget: 4096           # harness default; thinking off roughly halved one public score
tools:                              # adk_submission schema: tool names as strings, agents as agent_tool
  - run_command
  - read_file
  - write_file
  - edit_file
  - get_status
  - submit_patch
  - agent_tool:
      config_path: sub_agents/explorer.yaml
      skip_summarization: true      # keeps exploration out of the coder's context
