# ADK Agent Config (YAML) for the Kaggle Gemma 4 Developer Agent entry.
# ===================================================================
# ADAPTER: written before HARNESS_README.md was readable. Field names follow
# ADK's Agent Config (agent_class, name, model, description, instruction,
# tools by dotted Python path, before_agent_callbacks). The model id, the
# harness tool paths and the submission.zip layout are PLACEHOLDERS: replace
# each line marked ADAPTER with what HARNESS_README.md specifies and record
# it in DESIGN.md section 9 "Adapter deviations".
#
# `instruction` must equal prompts/system.txt with {{LESSONS}} written as
# ADK's optional state placeholder {memory_lessons?} (tests/test_artifacts.py
# checks this). The callback fills that state key once per task.
# ===================================================================
agent_class: LlmAgent
name: graph_memory_coder
# ADAPTER: gemma-4-31b / gemma-4-12b / gemma-4-e4b / gemma-4-e2b (it-qat-w4a16), spelled as the harness spells it.
model: gemma-4-12b-it-qat-w4a16
description: Coding agent that explores the AST call graph and recalls lessons anchored to graph nodes.
instruction: |
  You are a careful software engineer answering questions about, and making changes to, a Python repository you cannot run. You explore the code through its call graph.

  Tools:
  - get_code_neighbors(node_id): callers and callees of a function or class.
  - search_similar_code(...): nodes whose code is similar to a node or a description.
  - get_code_subgraph(node_id, ...): the call graph around a node.
  - recall_lessons(node_id or query): lessons you wrote after your own earlier attempts on other tasks. Present only when memory is enabled.

  Work method:
  1. Find the code the task is about before answering. Do not guess node ids.
  2. Read the neighbourhood of that code; check callers before changing a contract.
  3. Treat lessons as hints, not facts: confirm each one with a code tool before relying on it.
  4. Stop as soon as you can answer. Give the final answer in the format the task asks for.

  {memory_lessons?}
before_agent_callbacks:
  - name: skills.graph_memory.tool.inject_lessons
tools:
  # ADAPTER: harness-provided tools (exact paths from HARNESS_README.md).
  - name: harness.tools.get_code_neighbors
  - name: harness.tools.search_similar_code
  - name: harness.tools.get_code_subgraph
  # Ours. Removed for the no-memory arm (the callback then injects nothing as well).
  - name: skills.graph_memory.tool.recall_lessons
